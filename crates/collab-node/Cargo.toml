[package]
name = "deckcraft-collab-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The collaboration shim and the host window compiled for node (wasm-bindgen), so OneOS can test two windows converging through its real CRDT engine and drive a deck through the slides.* tools with the same command.batch the browser build answers"

# No workspace lints: the wasm-bindgen macros expand to code the workspace's `unsafe_code = "forbid"` refuses.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckcraft-model = { workspace = true }
deckcraft-collab = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
